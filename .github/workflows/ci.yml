name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml

  required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: build-and-test
    steps:
      - name: Require every build, test, and package check to pass
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: test "$BUILD_RESULT" = success
